[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mehbar"
version = "0.1.0"
description = "A highly customizable GTK 4 status bar for Wayland compositors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "examples/_base/icons/LICENSE"]
authors = [{ name = "Ilya B." }]
# argparse's suggest_on_error
requires-python = ">=3.14"
classifiers = [
    "Environment :: Wayland",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
# GTK 4, gtk4-layer-shell and, for the playerctl widget, Playerctl are system
# libraries with GObject introspection data
dependencies = [
    "PyGObject>=3.50",
    "anyio>=4.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
# i3_* widgets, i3 or sway
i3 = ["i3ipc>=2.2.1"]
# pulse_volume widget, PulseAudio or PipeWire; earlier pulsectl-asyncio
# versions may abort the process on shutdown
pulse = ["pulsectl-asyncio>=1.3.0"]
# config.yaml, config.jsonc and config.json5
yaml = ["PyYAML>=6"]
json5 = ["json5>=0.9"]
all = ["mehbar[i3,pulse,yaml,json5]"]
dev = ["mehbar[all]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
mehbar = "mehbar.__main__:main"

[project.urls]
Repository = "https://github.com/mehsayer/mehbar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mehbar = ["py.typed", "assets/*.gresource"]
"mehbar._widgets" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "display: needs a Wayland display, skipped without one",
]

[tool.ruff]
# formatting for 3.14 drops parentheses around exception tuples
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    # unused loop variables document tuple layouts
    "B007",
]
