[bar]
height = 32
icon_size = 20
layer = "top"
homogenous = true
position = "bottom"
gaps = [8, 8, 8, 8]

# Phosphor icons, https://phosphoricons.com (MIT license, see icons/LICENSE).
# Any of these names can be used in labels and ramps, e.g. "[icon=cpu;]".
[preload-icons]
# temperature
thermometer-cold = "theme://thermometer-cold-symbolic.svg"
thermometer-simple = "theme://thermometer-simple-symbolic.svg"
thermometer-hot = "theme://thermometer-hot-symbolic.svg"
# cpu_usage, cpu_fq, memory_usage, disk_usage, fan_speed
cpu = "theme://cpu-symbolic.svg"
gauge = "theme://gauge-symbolic.svg"
memory = "theme://memory-symbolic.svg"
hard-drives = "theme://hard-drives-symbolic.svg"
fan = "theme://fan-symbolic.svg"
# battery
battery-warning = "theme://battery-warning-symbolic.svg"
battery-low = "theme://battery-low-symbolic.svg"
battery-medium = "theme://battery-medium-symbolic.svg"
battery-high = "theme://battery-high-symbolic.svg"
battery-full = "theme://battery-full-symbolic.svg"
battery-charging = "theme://battery-charging-symbolic.svg"
# backlight
sun-horizon = "theme://sun-horizon-symbolic.svg"
sun-dim = "theme://sun-dim-symbolic.svg"
sun = "theme://sun-symbolic.svg"
# datetime
moon = "theme://moon-symbolic.svg"
moon-stars = "theme://moon-stars-symbolic.svg"
# bluetooth-status
bluetooth-slash = "theme://bluetooth-slash-symbolic.svg"
bluetooth = "theme://bluetooth-symbolic.svg"
bluetooth-connected = "theme://bluetooth-connected-symbolic.svg"
# pulse_volume
speaker-x = "theme://speaker-x-symbolic.svg"
speaker-none = "theme://speaker-none-symbolic.svg"
speaker-low = "theme://speaker-low-symbolic.svg"
speaker-high = "theme://speaker-high-symbolic.svg"
# wifi
wifi-slash = "theme://wifi-slash-symbolic.svg"
wifi-none = "theme://wifi-none-symbolic.svg"
wifi-low = "theme://wifi-low-symbolic.svg"
wifi-medium = "theme://wifi-medium-symbolic.svg"
wifi-high = "theme://wifi-high-symbolic.svg"
# wired, network_rate
network-slash = "theme://network-slash-symbolic.svg"
network-x = "theme://network-x-symbolic.svg"
network = "theme://network-symbolic.svg"
arrows-down-up = "theme://arrows-down-up-symbolic.svg"
# i3_kblayout, i3_mode, i3_window, i3_scratchpad
keyboard = "theme://keyboard-symbolic.svg"
command = "theme://command-symbolic.svg"
app-window = "theme://app-window-symbolic.svg"
stack = "theme://stack-symbolic.svg"
# i3_workspaces
circle-dashed = "theme://circle-dashed-symbolic.svg"
circle = "theme://circle-symbolic.svg"
circle-fill = "theme://circle-fill-symbolic.svg"
warning-circle = "theme://warning-circle-symbolic.svg"
# playerctl
skip-back = "theme://skip-back-symbolic.svg"
skip-forward = "theme://skip-forward-symbolic.svg"
rewind = "theme://rewind-symbolic.svg"
fast-forward = "theme://fast-forward-symbolic.svg"
play = "theme://play-symbolic.svg"
pause = "theme://pause-symbolic.svg"
shuffle = "theme://shuffle-symbolic.svg"
queue = "theme://queue-symbolic.svg"
music-note = "theme://music-note-symbolic.svg"
timer = "theme://timer-symbolic.svg"
# application, session, exec_*, file, static
globe = "theme://globe-symbolic.svg"
user = "theme://user-symbolic.svg"
terminal-window = "theme://terminal-window-symbolic.svg"
file-text = "theme://file-text-symbolic.svg"
line-vertical = "theme://line-vertical-symbolic.svg"


[start.temperature]
interval = 3
type = "temperature"
# cool, warm, hot
ramp = [
    "[icon=thermometer-cold;]",
    "[icon=thermometer-simple;]",
    "[icon=thermometer-hot;]",
]
label = "{k10temp/Tctl}°C"


[start.browser]
type = "application"
# matched by name, Zen's desktop entry has a generated ID and no icon
app_name = "Zen"
label = "[icon=globe;]"


[start.bluetooth]
type = 'bluetooth-status'
interval = 3
# off, on, connected
ramp = [
    "[icon=bluetooth-slash;]",
    "[icon=bluetooth;]",
    "[icon=bluetooth-connected;]",
]
label = "{alias}"


[center.cpu]
interval = 3
type = "cpu_usage"
label = "[icon=cpu;]{percent}%"


[center.memory]
interval = 3
type = "memory_usage"
label = "[icon=memory;]{percent}%"


[center.disk]
interval = 3
type = "disk_usage"
label = "[icon=hard-drives;]{percent}%"


[center.cpu_fq]
interval = 3
type = "cpu_fq"
label = "[icon=gauge;]{fq} GHz {percent}%"


[end.battery]
type = "battery"
interval = 3
# pairs of on battery, plugged in; from empty to full
ramp = [
    "[icon=battery-warning;]", "[icon=battery-charging;]",
    "[icon=battery-low;]", "[icon=battery-charging;]",
    "[icon=battery-medium;]", "[icon=battery-charging;]",
    "[icon=battery-high;]", "[icon=battery-charging;]",
    "[icon=battery-full;]", "[icon=battery-full;]",
]
label = "{percent}% {timeleft}"


[end.vol]
type = "pulse_volume"
# muted, then from silent to loud
ramp = [
    "[icon=speaker-x;]",
    "[icon=speaker-none;]",
    "[icon=speaker-low;]",
    "[icon=speaker-high;]",
]
label = "{percent}%"


[end.wlan]
type = "wifi"
iface = "wlp9s0"
backend = "iwd"
interval = 5
# no signal, then from weak to strong
ramp = [
    "[icon=wifi-slash;]",
    "[icon=wifi-none;]",
    "[icon=wifi-low;]",
    "[icon=wifi-medium;]",
    "[icon=wifi-high;]",
]
label = "{ssid} {percentage}%"


[end.kboard]
type = "i3_kblayout"
label = "[icon=keyboard;]{layout}"

[end.kboard.rewrite]
"Ukr\\w+" = "UA"
"Eng\\w+" = "EN"


[end.date]
interval = 10
type = "datetime"
# time of day, three hours each
ramp = [
    "[icon=moon-stars;]",
    "[icon=moon-stars;]",
    "[icon=sun-horizon;]",
    "[icon=sun;]",
    "[icon=sun;]",
    "[icon=sun;]",
    "[icon=sun-horizon;]",
    "[icon=moon;]",
]
label = "{datetime:%H:%M}"


